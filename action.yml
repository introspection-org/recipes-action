name: Recipes Check
description: Validate Introspection Recipes with the introspection CLI.
author: Introspection
branding:
  icon: check-circle
  color: blue
inputs:
  recipe-dir:
    description: Workspace root that Recipe manifests are discovered under.
    required: false
    default: "."
  version:
    description: "Version of @introspection-ai/cli to run (latest = always newest)."
    required: false
    default: "latest"
  node-version:
    description: Node.js version used to run the checker.
    required: false
    default: "24"
  upload-report:
    description: Upload the JSON diagnostics report as a build artifact.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    # The checker moved out of the npm package and into the CLI: the Recipes
    # package intentionally ships no `recipes` executable any more, and
    # `introspection check` is the supported validation command.
    - name: Install the Introspection CLI
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.version }}
      run: |
        npm install -g "@introspection-ai/cli@${CLI_VERSION}"
        echo "Using $(introspection --version)"

    - name: Run recipe check
      shell: bash
      env:
        RECIPE_DIR: ${{ inputs.recipe-dir }}
      # report.js is the gate, so never fail this step here (the redirect
      # always writes the file, even on a non-zero exit). `-o json` puts pure
      # JSON on stdout and the human summary on stderr, so the redirect stays
      # parseable.
      run: |
        introspection check --work-dir "${RECIPE_DIR}" -o json \
          > "${RUNNER_TEMP}/recipe-check-report.json" || true
        cp "${RUNNER_TEMP}/recipe-check-report.json" recipe-check-report.json || true

    - name: Annotate and summarize
      shell: bash
      env:
        RECIPE_DIR: ${{ inputs.recipe-dir }}
      # Emits inline annotations + a job-summary table and exits non-zero when
      # a Recipe is invalid, which fails the composite action.
      run: node "${GITHUB_ACTION_PATH}/report.js" "${RUNNER_TEMP}/recipe-check-report.json"

    - name: Compute report artifact name
      if: ${{ always() && inputs.upload-report == 'true' }}
      id: report
      shell: bash
      run: |
        slug=$(printf '%s' "${{ inputs.recipe-dir }}" | tr '/.' '--' | sed 's/^-*//; s/-*$//')
        echo "name=recipe-check-report${slug:+-$slug}" >> "$GITHUB_OUTPUT"

    - name: Upload recipe check report
      if: ${{ always() && inputs.upload-report == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.report.outputs.name }}
        path: recipe-check-report.json
        if-no-files-found: ignore
